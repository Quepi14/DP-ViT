[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dp-vit"
version = "0.1.1"
description = "Dynamic Patch Vision Transformer with ICS-based patch selection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "numpy",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]